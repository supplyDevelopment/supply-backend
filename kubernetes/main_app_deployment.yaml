apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: supply-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: "ghcr.io/supplydevelopment/supply-backend:latest"
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_datasource_url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_datasource_username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_datasource_password
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_rabbitmq_host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_rabbitmq_port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_rabbitmq_username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_rabbitmq_password
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_data_redis_host
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_data_redis_port
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: spring_data_redis_password
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 1024Mi
              cpu: 600m
            requests:
              memory: 512Mi
              cpu: 400m