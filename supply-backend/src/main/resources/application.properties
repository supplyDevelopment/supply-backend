spring.application.name=main-service

spring.datasource.url=${spring_datasource_url}
spring.datasource.username=${spring_datasource_username}
spring.datasource.password=${spring_datasource_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.leak-detection-threshold=10000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${jwt_secret}
jwt.expirationMs=86400000

spring.liquibase.enabled=true
spring.liquibase.change-log=${spring_liquibase_change-log}

spring.rabbitmq.host=${spring_rabbitmq_host}
spring.rabbitmq.port=${spring_rabbitmq_port}
spring.rabbitmq.username=${spring_rabbitmq_username}
spring.rabbitmq.password=${spring_rabbitmq_password}

spring.data.redis.host=${spring_data_redis_host}
spring.data.redis.port=${spring_data_redis_port}
spring.data.redis.password=${spring_data_redis_password}
spring.data.redis.timeout=2000
spring.cache.type=redis
spring.data.redis.jedis.pool.max-active=50
spring.data.redis.jedis.pool.max-idle=20
spring.data.redis.jedis.pool.min-idle=5
spring.data.redis.jedis.pool.max-wait=3000

yoo.kassa.shop.id=${yoo_kassa_shop_id}
yoo.kassa.shop.secret.key=${yoo_kassa_shop_secret_key}
yoo.kassa.redirect.url=https://supply-test.ecosystema.space/registr/handler